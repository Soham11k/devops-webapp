name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building DevOps Web App"
          ls -la

      - name: Test
        run: |
          test -f index.html
          echo "Test passed"

      - name: Generate logs
        run: |
          echo "CI Pipeline completed successfully"
